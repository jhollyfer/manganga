# Atualização de dependência, aberta como PR para passar pela mesma CI de
# sempre. É a lacuna de segurança com a melhor relação entre o que custa e o
# que evita, e por isso está igual nos quatro projetos.
#
# Semanal e com teto de PRs abertos: diário afoga a revisão, e é a revisão que
# faz a atualização valer alguma coisa.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [patch]

  # As actions são pinadas por tag móvel (`@v4`), que muda de conteúdo sem
  # mudar de nome. Este bloco é o que dá visibilidade a essa troca.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
