name: Commitlint

# Os commits deste repositorio sao Conventional Commits em pt-BR, e isso estava
# escrito na regua e cobrado por ninguem. O `pre-commit` nao os valida, e quem
# usa `--no-verify` passa direto.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # O historico inteiro: sem ele o `--from` do PR nao resolve.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Os **dois** pacotes no `npx`, e é o que faltava: `npx commitlint@20`
      # instala só a CLI, e o `--extends` pede um pacote que ela não traz. O
      # passo morria com `Cannot find module "@commitlint/config-conventional"`
      # antes de olhar um commit sequer - ou seja, reprovava todo PR do
      # repositório sem nunca ter validado nada.
      #
      # `-p` declara cada pacote a instalar e o comando vem depois, por nome.
      - name: Validar commits do PR
        run: npx --yes -p commitlint@20 -p @commitlint/config-conventional commitlint --extends @commitlint/config-conventional --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
