name: Build Frontend

# Reusable: quem chama é o `main.yml`, no push para `main`. O gatilho de push
# direto que este arquivo tinha existia enquanto a cadeia de deploy não existia
# neste projeto; agora ela existe, e dois gatilhos para o mesmo build rodariam o
# mesmo trabalho duas vezes.
on:
  workflow_call:

jobs:
  build:
    name: Compile & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      # O carimbo da revisão: o arquivo vira `https://manganga.maiyu.com.br/revision.txt`
      # sem uma linha de código de aplicação. Sem ele o deploy do frontend não tem prova nenhuma do outro
      # lado - o `curl` para o Coolify só diz que o pedido foi aceito.
      #
      # **Antes do build, e em `public/`.** Ele já esteve depois, escrevendo
      # direto em `.output/public/`, e nunca funcionou: o Nitro não lê aquele
      # diretório em runtime, ele consulta um manifesto embutido em
      # `.output/server/index.mjs` que é congelado durante o build. Arquivo que
      # chega depois existe no disco - aparece no `ls` do container - e mesmo
      # assim cai no catch-all de SSR, que responde 200 com HTML. O smoke test
      # do deploy comparava aquele HTML com o sha e esperava cinco minutos por
      # uma revisão que nunca chegaria.
      #
      # `public/` é a pasta que o Vite copia para `.output/public/` durante o
      # build, e é isso que faz o carimbo entrar no manifesto.
      - name: Carimba a revisão antes do build
        run: echo "${{ github.sha }}" > frontend/public/revision.txt

      - name: Build
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm build

      # O carimbo no disco sem entrada no manifesto não quebra nada - foi
      # exatamente assim que ele passou despercebido. Por isso a cobrança é
      # automática: mover o passo acima de volta para depois do build custa
      # outros cinco minutos de espera cega no deploy.
      - name: O carimbo entrou no manifesto do Nitro
        working-directory: ./frontend
        run: |
          set -euo pipefail

          if ! grep -q '"/revision.txt"' .output/server/index.mjs; then
            echo 'revision.txt não está no manifesto de assets do Nitro.'
            echo 'O carimbo precisa ser escrito ANTES do build, em public/.'
            exit 1
          fi

          echo 'revision.txt está no manifesto e será servido como text/plain.'

      # Sobe antes da conferência, e não depois: quando o guarda abaixo reprova,
      # o `.output/` é justamente o que se precisa abrir para achar a leitura
      # culpada. Reprovar sem artifact deixa a investigação sem material.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          retention-days: 1
          include-hidden-files: true
          path: |
            frontend/.output/

      # O job falha aqui, então o artifact existe mas nenhuma imagem sai dele:
      # `docker-frontend` depende deste job, e não do artifact.
      #
      # O que se recusa não é o ciclo (o router do TanStack sai em dois chunks
      # que se reexportam, e isso é inerte), é a **leitura antecipada** de um
      # binding que vem de um chunk em ciclo. Essa passa o build verde e só
      # quebra no primeiro SSR em produção.
      - name: Check chunk cycles
        working-directory: ./frontend
        run: pnpm check-cycles
